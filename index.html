<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>American Standard Gas Diagnostic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .header {
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 1.1rem;
      color: #333;
      margin: 0;
      font-weight: 700;
    }
    .badge {
      background-color: #e8f4fd;
      color: #0070f3;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .content-area {
      min-height: 140px;
      margin-bottom: 20px;
    }
    .tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .tag.question { background-color: #fce4ec; color: #c2185b; }
    .tag.action { background-color: #e1f5fe; color: #0288d1; }
    .tag.success { background-color: #e8f5e9; color: #2e7d32; }
    .tag.replace { background-color: #ffebee; color: #c62828; }
    
    .step-text {
      font-size: 1.15rem;
      color: #111;
      line-height: 1.5;
      font-weight: 500;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      width: 100%;
    }
    button:active { transform: scale(0.98); }
    
    .btn-pink { background-color: #d80073; color: white; }
    .btn-pink:hover { background-color: #b0005e; }
    
    .btn-blue { background-color: #0078d7; color: white; }
    .btn-blue:hover { background-color: #005a9e; }
    
    .btn-secondary { background-color: #f0f0f0; color: #333; }
    .btn-secondary:hover { background-color: #e0e0e0; }
    
    .btn-restart {
      margin-top: 15px;
      background: transparent;
      color: #666;
      font-size: 0.85rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>American Standard Diagnostic</h1>
      <span class="badge">Gas Pilot</span>
    </div>

    <div class="content-area">
      <div id="type-tag" class="tag question">Question</div>
      <div id="node-text" class="step-text">Loading...</div>
    </div>

    <div id="buttons-box" class="btn-container"></div>
    <button id="btn-back" class="btn-restart" style="display:none;" onclick="goBack()">← Previous Step</button>
  </div>

  <script>
    const kb = {
      "q_main_valve": {
        "type": "question",
        "tag": "Question",
        "text": "Is the main gas line valve open? (are other gas appliances working)",
        "options": [
          { "label": "Yes", "next": "q_new_installation" },
          { "label": "No", "next": "act_open_valve" }
        ]
      },
      "act_open_valve": {
        "type": "action",
        "tag": "Required Action",
        "text": "Open main gas valve.",
        "options": [{ "label": "Done / Continue", "next": "q_new_installation" }]
      },
      "q_new_installation": {
        "type": "question",
        "tag": "Question",
        "text": "Is a new installation, or recently serviced?",
        "options": [
          { "label": "Yes", "next": "q_ventilated" },
          { "label": "No", "next": "q_pilot_light" }
        ]
      },
      "q_ventilated": {
        "type": "question",
        "tag": "Question",
        "text": "Is ventilated well?",
        "options": [
          { "label": "Yes", "next": "q_purged_gas_line" },
          { "label": "No", "next": "act_create_ventilation" }
        ]
      },
      "act_create_ventilation": {
        "type": "action",
        "tag": "Required Action",
        "text": "Create a proper ventilation environment.",
        "options": [{ "label": "Done / Continue", "next": "q_purged_gas_line" }]
      },
      "q_purged_gas_line": {
        "type": "question",
        "tag": "Question",
        "text": "Has the pilot gas line been purged through the gas valve?",
        "options": [
          { "label": "Yes", "next": "act_blow_pilot_tube" },
          { "label": "No", "next": "act_unscrew_pilot_tube" }
        ]
      },
      "act_unscrew_pilot_tube": {
        "type": "action",
        "tag": "Required Action",
        "text": "Unscrew the pilot gas tube (silver thin tube), turn the knob on the gas valve to the pilot position, then press and hold it down for a minute or 2. You should be able to hear and smell the gas coming from the pilot gas tube port at the bottom of the gas valve.",
        "options": [{ "label": "Done / Continue", "next": "q_smell_hear_air" }]
      },
      "q_smell_hear_air": {
        "type": "question",
        "tag": "Question",
        "text": "Can you   smell and hear the gas coming through at the bottom of the gas valve?",
        "options": [
          { "label": "Yes", "next": "act_blow_pilot_tube" },
          { "label": "No", "next": "end_replace_gas_valve" }
        ]
      },
      "act_blow_pilot_tube": {
        "type": "action",
        "tag": "Required Action",
        "text": "Blow through the pilot gas tube.",
        "options": [{ "label": "Done / Continue", "next": "q_air_passing_freely" }]
      },
      "q_air_passing_freely": {
        "type": "question",
        "tag": "Question",
        "text": "Is air passing freely through the pilot gas tube to the pilot assembly?",
        "options": [
          { "label": "Yes", "next": "q_pilot_light" },
          { "label": "No", "next": "q_obstruct_kink" }
        ]
      },
      "q_obstruct_kink": {
        "type": "question",
        "tag": "Question",
        "text": "Is there something obstructing the pilot tube or is it bent/kinked?",
        "options": [
          { "label": "Yes", "next": "act_clear_obstruction" },
          { "label": "No", "next": "end_replace_pilot_assembly" }
        ]
      },
      "act_clear_obstruction": {
        "type": "action",
        "tag": "Required Action",
        "text": "Clear the obstruction.",
        "options": [{ "label": "Done / Continue", "next": "q_air_passing_freely" }]
      },

      // MAIN PILOT CHECK
      "q_pilot_light": {
        "type": "question",
        "tag": "Main Question",
        "text": "Does pilot light?",
        "options": [
          { "label": "Yes", "next": "q_pilot_stay_on" },
          { "label": "No", "next": "act_click_ignitor" }
        ]
      },
      "q_pilot_stay_on": {
        "type": "question",
        "tag": "Question",
        "text": "Does pilot stay on?",
        "options": [
          { "label": "Yes", "next": "end_success" },
          { "label": "No", "next": "q_hlw_popped" }
        ]
      },

      // PIEZO / IGNITER BRANCH
      "act_click_ignitor": {
        "type": "action",
        "tag": "Test",
        "text": "Click the ignitor to check for the spark.",
        "options": [{ "label": "Continue", "next": "q_spark_hitting_burner" }]
      },
      "q_spark_hitting_burner": {
        "type": "question",
        "tag": "Question",
        "text": "Is the spark reaching the burner when clicking on the piezo igniter?",
        "options": [
          { "label": "Yes", "next": "act_check_distance" },
          { "label": "No", "next": "act_disconnect_igniter" }
        ]
      },
      "act_disconnect_igniter": {
        "type": "action",
        "tag": "Test",
        "text": "Disconnect the igniter from the wire and check it alone for spark.",
        "options": [{ "label": "Continue", "next": "q_igniter_producing_spark" }]
      },
      "q_igniter_producing_spark": {
        "type": "question",
        "tag": "Question",
        "text": "Is the igniter producing a spark?",
        "options": [
          { "label": "Yes", "next": "act_remove_burner_assembly" },
          { "label": "No", "next": "end_replace_ignitor" }
        ]
      },
      "act_remove_burner_assembly": {
        "type": "action",
        "tag": "Required Action",
        "text": "Remove the burner assembly. Check continuity on the cable that goes from the push igniter all the way to the burner igniter.",
        "options": [{ "label": "Continue", "next": "q_cable_continuity" }]
      },
      "q_cable_continuity": {
        "type": "question",
        "tag": "Question",
        "text": "Is there cable continuity?",
        "options": [
          { "label": "Yes", "next": "act_reconnect_igniter" },
          { "label": "No", "next": "end_replace_pilot_assembly" }
        ]
      },
      "act_reconnect_igniter": {
        "type": "action",
        "tag": "Required Action",
        "text": "Connect the igniter back to its wire, making sure it is firmly connected. Put the orange cover back and try the igniter again.",
        "options": [{ "label": "Continue", "next": "q_spark_hitting_burner_2" }]
      },
      "q_spark_hitting_burner_2": {
        "type": "question",
        "tag": "Question",
        "text": "Is the spark reaching the burner when clicking on the piezo igniter?",
        "options": [
          { "label": "Yes", "next": "act_check_distance" },
          { "label": "No", "next": "end_replace_pilot_assembly" }
        ]
      },
      "act_check_distance": {
        "type": "action",
        "tag": "Test",
        "text": "Check distance between the igniter electrode and the pilot gas tube in the pilot assembly on the burner end.",
        "options": [{ "label": "Continue", "next": "q_distance_1_8" }]
      },
      "q_distance_1_8": {
        "type": "question",
        "tag": "Question",
        "text": "Is the distance around 1/8 in?",
        "options": [
          { "label": "Yes", "next": "act_reinstall_pilot_assembly" },
          { "label": "No", "next": "act_move_electrode" }
        ]
      },
      "act_move_electrode": {
        "type": "action",
        "tag": "Required Action",
        "text": "Move the electrode accordingly.",
        "options": [{ "label": "Done / Continue", "next": "act_reinstall_pilot_assembly" }]
      },
      "act_reinstall_pilot_assembly": {
        "type": "action",
        "tag": "Required Action",
        "text": "Reinstall the pilot assembly. Try to light the pilot.",
        "options": [{ "label": "Continue", "next": "q_pilot_lighting" }]
      },
      "q_pilot_lighting": {
        "type": "question",
        "tag": "Question",
        "text": "Is the pilot lighting?",
        "options": [
          { "label": "Yes", "next": "q_pilot_stay_on" },
          { "label": "No", "next": "end_replace_pilot_assembly" }
        ]
      },

      // PILOT GOES OUT BRANCH
      "q_hlw_popped": {
        "type": "question",
        "tag": "Question",
        "text": "Check if the HLS (High Limit Switch) is popped out",
        "options": [{ "label": "Continue", "next": "act_push_reset" }]
      },
      "act_push_reset": {
        "type": "action",
        "tag": "Required Action",
        "text": "Push the little red button on the HLS (it needs to be cool), If There is dirt or lint on the mesh clean it, and Check continuity on the HLS.",
        "options": [{ "label": "Continue", "next": "q_hls_continuity" }]
      },
      "q_hls_continuity": {
        "type": "question",
        "tag": "Question",
        "text": "Is there continuity on the HLS?",
        "options": [
          { "label": "Yes", "next": "act_check_draft" },
          { "label": "No", "next": "end_replace_hls" }
        ]
      },
      "act_check_draft": {
        "type": "action",
        "tag": "Test",
        "text": "Check for air flow in draft hood/flue: Is burner/pilot on when doors are open, but goes out when doors are closed? Hold a match or some source of flame or smoke near draft hood. Look if combustion gases are back-drafting.",
        "options": [{ "label": "Continue", "next": "act_check_negative_air" }]
      },
      "act_check_negative_air": {
        "type": "action",
        "tag": "Environmental Test",
        "text": "Check for negative pressure in room: If room has exhaust fans, turn them off to check if flame stays lit. Look for open windows / make-up air vents if room is sealed.",
        "options": [{ "label": "Continue", "next": "q_negative_air" }]
      },
      "q_negative_air": {
        "type": "question",
        "tag": "Question",
        "text": "Is negative air present?",
        "options": [
          { "label": "Yes", "next": "act_provide_outdoor_air" },
          { "label": "No", "next": "act_check_thermocouple_pos" }
        ]
      },
      "act_provide_outdoor_air": {
        "type": "action",
        "tag": "Required Action",
        "text": "Provide a way for outdoor fresh air to enter room (open window, door, or add air vent / louvered door to the room / space).",
        "options": [{ "label": "Done / Continue", "next": "act_check_thermocouple_pos" }]
      },
      "act_check_thermocouple_pos": {
        "type": "action",
        "tag": "Thermal Test",
        "text": "Check the position of the thermocouple: Thermocouple needs to be in contact with the flame. Check position of flame relative to thermocouple tip. Check millivolts output using multimeter while holding pilot button for 60 seconds.",
        "options": [{ "label": "Continue", "next": "q_at_least_18mv" }]
      },
      "q_at_least_18mv": {
        "type": "question",
        "tag": "Question",
        "text": "Is thermocouple generating at least 18mV?",
        "options": [
          { "label": "Yes", "next": "act_check_thermocouple_tight" },
          { "label": "No", "next": "end_replace_pilot_assembly" }
        ]
      },
      "act_check_thermocouple_tight": {
        "type": "action",
        "tag": "Verification",
        "text": "Check that the thermocouple is not loose and properly screwed to the gas valve. Check continuity between the wires that connect the high limit switch / ECO switch and the gas valve.",
        "options": [{ "label": "Continue", "next": "q_switch_continuity" }]
      },
      "q_switch_continuity": {
        "type": "question",
        "tag": "Question",
        "text": "Is there continuity?",
        "options": [
          { "label": "Yes", "next": "q_pilot_stay_on_2" },
          { "label": "No", "next": "end_replace_gas_valve" }
        ]
      },
      "q_pilot_stay_on_2": {
        "type": "question",
        "tag": "Question",
        "text": "Does pilot stay on now?",
        "options": [
          { "label": "Yes", "next": "end_success" },
          { "label": "No", "next": "end_replace_gas_valve" }
        ]
      },

      // FINAL DIAGNOSIS
      "end_success": {
        "type": "success",
        "tag": "Solved",
        "text": "Success! The pilot lights and stays lit correctly.",
        "options": [{ "label": "Start New Diagnostic", "next": "q_main_valve" }]
      },
      "end_replace_gas_valve": {
        "type": "replace",
        "tag": "Final Diagnosis",
        "text": "🛠️ Replace the gas valve.",
        "options": [{ "label": "Start New Diagnostic", "next": "q_main_valve" }]
      },
      "end_replace_pilot_assembly": {
        "type": "replace",
        "tag": "Final Diagnosis",
        "text": "🛠️ Replace the pilot assembly.",
        "options": [{ "label": "Start New Diagnostic", "next": "q_main_valve" }]
      },
      "end_replace_ignitor": {
        "type": "replace",
        "tag": "Final Diagnosis",
        "text": "🛠️ Replace the ignitor.",
        "options": [{ "label": "Start New Diagnostic", "next": "q_main_valve" }]
      },
      "end_replace_hls": {
        "type": "replace",
        "tag": "Final Diagnosis",
        "text": "🛠️ Replace the High Limit Switch (HLS).",
        "options": [{ "label": "Start New Diagnostic", "next": "q_main_valve" }]
      }
    };

    let historyStack = [];
    let currentNode = "q_main_valve";

    // Escuchar cambios en la URL (cambios de Hash o botón Atrás/Adelante del navegador)
    window.addEventListener("hashchange", () => {
      let hash = window.location.hash.replace("#", "");
      if (!kb[hash]) {
        hash = "q_main_valve";
      }
      renderNode(hash);
    });

    function renderNode(nodeId) {
      // Si estamos en el nodo inicial, reiniciamos el historial
      if (nodeId === "q_main_valve") {
        historyStack = [];
      }

      const node = kb[nodeId];
      if (!node) return;

      currentNode = nodeId;

      const tagEl = document.getElementById("type-tag");
      const textEl = document.getElementById("node-text");
      const boxEl = document.getElementById("buttons-box");
      const backBtn = document.getElementById("btn-back");

      tagEl.className = "tag " + node.type;
      tagEl.innerText = node.tag;
      textEl.innerText = node.text;

      boxEl.innerHTML = "";

      node.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.innerText = opt.label;

        if (opt.label === "Yes") btn.className = "btn-pink";
        else if (opt.label === "No") btn.className = "btn-secondary";
        else btn.className = "btn-blue";

        btn.onclick = () => {
          if (currentNode !== opt.next) {
            historyStack.push(currentNode);
          }
          // Cambia el hash en la URL, lo que dispara 'hashchange' automáticamente
          window.location.hash = opt.next;
        };
        boxEl.appendChild(btn);
      });

      backBtn.style.display = historyStack.length > 0 ? "block" : "none";
    }

    function goBack() {
      if (historyStack.length > 0) {
        const lastNode = historyStack.pop();
        window.location.hash = lastNode;
      }
    }

    // Inicialización al cargar la página
    window.onload = () => {
      let initialHash = window.location.hash.replace("#", "");
      if (!initialHash || !kb[initialHash]) {
        window.location.hash = "q_main_valve";
      } else {
        renderNode(initialHash);
      }
    };
  </script>
</body>
</html>
