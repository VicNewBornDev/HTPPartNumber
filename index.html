.container{max-width:1280px;margin:0 auto}
header{text-align:center;margin-bottom:26px}

.card{background:linear-gradient(180deg,var(--card) 0%,var(--bg-soft) 100%);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,0.25)}
.control-grid{display:grid;grid-template-columns:1.1fr 1fr 1.4fr 1.6fr 1.3fr auto;gap:14px;align-items:end}
@media(max-width:1100px){.control-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.control-grid{grid-template-columns:1fr}}
label{font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:7px}
select,input{height:42px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0f141e;color:var(--text);font-size:0.92rem;width:100%}

.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:#22304a;color:var(--text);font-weight:600;font-size:0.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent-2);border-color:#3a7bc8;color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

.table-header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}
.table-container{overflow:auto;border-radius:12px;border:1px solid var(--border);max-height:72vh}
table{width:100%;border-collapse:collapse;background:var(--card)} th{position:sticky;top:0;z-index:2;background:#23314f;color:#c8d6ea;padding:13px 14px;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:0.93rem;vertical-align:top} tr:nth-child(even){background:var(--row-alt)} tr:hover{background:var(--row-hover)}

.copy-btn{background:#22304a;color:var(--text);border:1px solid var(--border);padding:5px 10px;border-radius:7px;font-size:0.78rem;font-weight:700;cursor:pointer}

function getFilteredFamilies(){const a=appSelect.value,f=fuelSelect.value;return catalogDatabase.filter(x=>(!a||x.application===a)&&(!f||x.fuel===f));}
function updateFamilyDropdown(){const cur=familySelect.value,filtered=getFilteredFamilies();familySelect.innerHTML='<option value="">All Families...</option>';filtered.forEach(f=>{const o=document.createElement('option');o.value=f.family;o.textContent=`${f.family} (${f.models.length})`;familySelect.appendChild(o);});if(filtered.some(f=>f.family===cur))familySelect.value=cur;}
function updateModelDropdown(){const cur=modelSelect.value,famFilter=familySelect.value,families=getFilteredFamilies();modelSelect.innerHTML='<option value="">Choose a model...</option>';families.forEach(fam=>{if(!famFilter||fam.family===famFilter){fam.models.forEach(mod=>{const o=document.createElement('option');o.value=mod.modelName;o.dataset.family=fam.family;o.textContent=mod.modelName;modelSelect.appendChild(o);})}});if([...modelSelect.options].some(o=>o.value===cur))modelSelect.value=cur;}
function getActiveParts(){const selFam=familySelect.value,selMod=modelSelect.value;return getFilteredFamilies().filter(f=>!selFam||f.family===selFam).flatMap(f=>f.models.filter(m=>!selMod||m.modelName===selMod).flatMap(m=>m.parts.map(p=>({...p,family:f.family,modelName:m.modelName,application:f.application,fuel:f.fuel}))));}
function debounce(fn,ms){let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function highlight(t,term){if(!term)return escapeHtml(t);const esc=term.replace(/[.*+?^${}()|[\]\\]/g,'\$&');return escapeHtml(t).replace(new RegExp('('+esc+')','ig'),'<span class="highlight">$1</span>');}

function shortModelName(family, modelName){
  // Remove family prefix from modelName if present
  let s=modelName.trim();
  if(s.toLowerCase().startsWith(family.toLowerCase())){
    s=s.slice(family.length).trim();
    // remove leading separators like - – :
    s=s.replace(/^\s*[-–—:]\s*/, '').trim();
  }
  // If still empty, return modelName (or empty)
  return s || modelName;
}

function groupByPartNumber(partsArray){
  if(modelSelect.value){
    return partsArray.map(p=>({desc:p.desc, part:p.part, familyGroups:new Map([[p.family, {family:p.family, models:[shortModelName(p.family,p.modelName)]}]])}));
  }
  const map=new Map(); // partKey -> {desc, part, familyMap}
  for(const p of partsArray){
    const key=p.part.trim().toLowerCase();
    if(!map.has(key)){
      map.set(key,{desc:p.desc, part:p.part, familyMap:new Map()});
    }
    const entry=map.get(key);
    const fam=entry.familyMap.get(p.family) || {family:p.family, models:[], seen:new Set()};
    const shortM=shortModelName(p.family,p.modelName);
    const fullKey=p.modelName; // use full modelName for uniqueness
    if(!fam.seen.has(fullKey)){
      fam.models.push(shortM);
      fam.seen.add(fullKey);
    }
    entry.familyMap.set(p.family, fam);
  }
  // Convert familyMap to array for easier rendering
  return Array.from(map.values()).map(e=>{
    const groups=Array.from(e.familyMap.values()).map(g=>({family:g.family, models:g.models}));
    return {desc:e.desc, part:e.part, familyGroups:groups, totalModels:groups.reduce((a,g)=>a+g.models.length,0)};
  });
}

function applyFilters(){
  lastSearchTerm=partSearch.value.trim().toLowerCase();
  let parts=getActiveParts();
  if(lastSearchTerm){parts=parts.filter(p=>p.desc.toLowerCase().includes(lastSearchTerm)||p.part.toLowerCase().includes(lastSearchTerm));}
  currentFiltered=parts;
  groupedFiltered=groupByPartNumber(parts);
  const sort=sortSelect.value;
  groupedFiltered.sort((a,b)=>{
    if(sort==='part-asc') return a.part.localeCompare(b.part);
    if(sort==='models-desc') return b.totalModels - a.totalModels || a.desc.localeCompare(b.desc);
    return a.desc.localeCompare(b.desc);
  });
  visibleCount=100; render(); updateStats(); updateChips(); saveState(); syncURL();
}

    const frag=document.createDocumentFragment();
    slice.forEach(entry=>{
      const tr=document.createElement('tr');
      const tdDesc=document.createElement('td');
      // Build family-grouped tags: one tag per family, models inside { }
      let tagsHtml='<div class="heater-tags">';
      if(entry.familyGroups){
        const groups = entry.familyGroups instanceof Map ? Array.from(entry.familyGroups.values()) : entry.familyGroups;
        groups.forEach(g=>{
          const famEsc=escapeHtml(g.family);
          if(!g.models || g.models.length===0){
            tagsHtml+=`<span class="heater-tag"><span class="family">${famEsc}</span></span>`;
          } else if(g.models.length===1){
            // single model: Family - Model or just Family { Model } ? use dash for single
            const mEsc=escapeHtml(g.models[0]);
            if(mEsc.toLowerCase()===famEsc.toLowerCase() || g.models[0]===g.family){
              tagsHtml+=`<span class="heater-tag"><span class="family">${famEsc}</span></span>`;
            } else {
              tagsHtml+=`<span class="heater-tag"><span class="family">${famEsc}</span><span class="sep">—</span><span class="models">${mEsc}</span></span>`;
            }
          } else {
            // multiple models: Family { model1, model2 }
            const modelsStr=g.models.map(m=>escapeHtml(m)).join('<span class="sep">, </span>');
            tagsHtml+=`<span class="heater-tag"><span class="family">${famEsc}</span><span class="sep"> { </span><span class="models">${modelsStr}</span><span class="sep"> }</span></span>`;
          }
        });
      }
      tagsHtml+='</div>';
      tdDesc.innerHTML=`<div>${highlight(entry.desc,lastSearchTerm)}</div>${tagsHtml}`;
      const tdPart=document.createElement('td');
      tdPart.innerHTML=`<div class="part-cell"><span class="part-badge">${highlight(entry.part,lastSearchTerm)}</span><button class="copy-btn">Copy</button></div>`;
      const btn=tdPart.querySelector('button');
      btn.addEventListener('click',()=>{navigator.clipboard.writeText(entry.part).then(()=>{btn.textContent='Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1200);});});
      tr.appendChild(tdDesc); tr.appendChild(tdPart); frag.appendChild(tr);
    });
    partsTableBody.appendChild(frag);
  }
  if(modelSelect.value){
    resultMeta.textContent=`${totalUnique} parts in ${modelSelect.value}`;
  } else {
    resultMeta.textContent=`${totalUnique} unique parts`+(totalRaw!==totalUnique?` (${totalRaw} occurrences merged)`:'')+(lastSearchTerm?` for "${partSearch.value.trim()}"`:'');
  }
  pageInfo.textContent=totalUnique?`Showing ${Math.min(visibleCount,totalUnique)} of ${totalUnique}`:'';
  loadMoreBtn.style.display=visibleCount<totalUnique?'inline-flex':'none';
}

function updateStats(){const fam=getFilteredFamilies().length,mods=getFilteredFamilies().filter(f=>!familySelect.value||f.family===familySelect.value).flatMap(f=>f.models).length;document.getElementById('statsBar').innerHTML=`<b>${catalogDatabase.length}</b> families | <b>${allCatalogParts.length}</b> total — <b>${fam}</b> families / <b>${mods}</b> models | Press <span class="kbd">/</span> to search`;}
function updateChips(){const chips=[];if(appSelect.value)chips.push({k:'app',l:`App: ${appSelect.value}`});if(fuelSelect.value)chips.push({k:'fuel',l:`Fuel: ${fuelSelect.value}`});if(familySelect.value)chips.push({k:'family',l:familySelect.value});if(modelSelect.value)chips.push({k:'model',l:modelSelect.value});if(lastSearchTerm)chips.push({k:'q',l:`Search: "${partSearch.value.trim()}"`});const row=document.getElementById('chipsRow');row.innerHTML=chips.map(c=>`<span class="chip">${escapeHtml(c.l)} <button data-k="${c.k}">x</button></span>`).join('');row.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;if(k==='app')appSelect.value='';if(k==='fuel')fuelSelect.value='';if(k==='family')familySelect.value='';if(k==='model')modelSelect.value='';if(k==='q')partSearch.value='';updateFamilyDropdown();updateModelDropdown();applyFilters();}));}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify({app:appSelect.value,fuel:fuelSelect.value,family:familySelect.value,model:modelSelect.value,q:partSearch.value,sort:sortSelect.value}));}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!s)return false;appSelect.value=s.app||'';fuelSelect.value=s.fuel||'';updateFamilyDropdown();familySelect.value=s.family||'';updateModelDropdown();modelSelect.value=s.model||'';partSearch.value=s.q||'';sortSelect.value=s.sort||'desc-asc';return true;}catch(e){return false;}}
function syncURL(){const p=new URLSearchParams();if(appSelect.value)p.set('app',appSelect.value);if(fuelSelect.value)p.set('fuel',fuelSelect.value);if(familySelect.value)p.set('family',familySelect.value);if(modelSelect.value)p.set('model',modelSelect.value);if(partSearch.value.trim())p.set('q',partSearch.value.trim());history.replaceState(null,'','?'+p.toString());}
function readURL(){const p=new URLSearchParams(location.search);if(p.has('app'))appSelect.value=p.get('app');if(p.has('fuel'))fuelSelect.value=p.get('fuel');updateFamilyDropdown();if(p.has('family'))familySelect.value=p.get('family');updateModelDropdown();if(p.has('model'))modelSelect.value=p.get('model');if(p.has('q'))partSearch.value=p.get('q');return p.toString().length>0;}

appSelect.onchange=()=>{familySelect.value='';modelSelect.value='';updateFamilyDropdown();updateModelDropdown();applyFilters();};
fuelSelect.onchange=()=>{familySelect.value='';modelSelect.value='';updateFamilyDropdown();updateModelDropdown();applyFilters();};
familySelect.onchange=()=>{const obj=catalogDatabase.find(f=>f.family===familySelect.value);if(obj){appSelect.value=obj.application;fuelSelect.value=obj.fuel;}modelSelect.value='';updateFamilyDropdown();updateModelDropdown();applyFilters();};
modelSelect.onchange=()=>{applyFilters();};
partSearch.addEventListener('input',debouncedApply);
sortSelect.onchange=()=>{applyFilters();};
loadMoreBtn.onclick=()=>{visibleCount+=100;render();};
document.getElementById('resetBtn').onclick=()=>{appSelect.value='';fuelSelect.value='';familySelect.value='';modelSelect.value='';partSearch.value='';updateFamilyDropdown();updateModelDropdown();currentFiltered=[];groupedFiltered=[];render();updateStats();updateChips();};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){e.preventDefault();partSearch.focus();} if(e.key==='Escape') partSearch.blur();});
document.getElementById('shareBtn').onclick=()=>{navigator.clipboard.writeText(location.href).then(()=>{const b=document.getElementById('shareBtn');b.textContent='Copied!';setTimeout(()=>b.textContent='Share link',1200);});};
document.getElementById('exportBtn').onclick=()=>{if(!groupedFiltered.length)return alert('No results'); const rows=[['Description','Part Number','Compatible Families & Models']].concat(groupedFiltered.map(e=>[e.desc,e.part,e.familyGroups.map(g=>`${g.family} { ${g.models.join(', ')} }`).join(' | ')])); const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'); const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='htp-parts-grouped.csv';a.click();};
document.getElementById('copyAllBtn').onclick=()=>{const txt=groupedFiltered.slice(0,visibleCount).map(e=>`${e.desc} — ${e.part}`).join('\n'); navigator.clipboard.writeText(txt);};

const hasURL=readURL(); if(!hasURL) loadState(); updateFamilyDropdown(); updateModelDropdown(); updateStats(); if(hasURL||partSearch.value||modelSelect.value||familySelect.value||appSelect.value||fuelSelect.value){applyFilters();} else {updateChips();}
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocu
